[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The only client-side route besides "/". Other missing paths stay real 404s,
# so a misnamed photo or audio file fails visibly instead of returning HTML.
[[redirects]]
  from = "/private-inbox"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/private-inbox/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
